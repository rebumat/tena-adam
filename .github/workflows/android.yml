name: Build Tena Adam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tena-adam-v1.1.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Tena Adam v1.1.0
          body: |
            Tena Adam (ጤናአዳም) v1.1.0 — Ethiopian health super app.
            Debug APK built automatically by GitHub Actions.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
