name: Build Tena Adam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -w "$SDK_DIR" ]; then SDK_DIR="$HOME/android-sdk"; fi
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sS -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tena-adam-v1.1.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Tena Adam v1.1.0
          body: |
            Tena Adam (ጤናአዳም) v1.1.0 — Ethiopian health super app.
            Debug APK built automatically by GitHub Actions.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
